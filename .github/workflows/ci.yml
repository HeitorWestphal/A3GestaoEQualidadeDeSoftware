name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build, testes e cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e executar testes (JUnit + JaCoCo)
        run: ./mvnw -B verify

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-jacoco
          path: target/site/jacoco/

  quality-gate:
    name: Análise estática e quality gate (SonarCloud)
    runs-on: ubuntu-latest
    needs: build
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      # Sem token não há análise: o job falha para não ser confundido com quality gate aprovado.
      - name: Verificar configuração do SonarCloud
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN não configurado: a análise estática NÃO foi executada e o quality gate NÃO foi verificado."
            {
              echo "## ❌ Análise estática não executada"
              echo
              echo "O secret \`SONAR_TOKEN\` não está disponível. O quality gate **não foi verificado**."
              echo "Veja [docs/sonarcloud.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/sonarcloud.md)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo para a análise de código novo

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Testes, cobertura e envio da análise ao SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar

      - name: Consultar resultado do quality gate
        env:
          COMMIT_ANALISADO: ${{ github.event.pull_request.head.sha || github.sha }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: .github/scripts/quality-gate.sh

      - name: Publicar evidências da análise
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-sonarcloud
          path: |
            target/sonar/report-task.txt
            target/quality-gate/
          if-no-files-found: ignore
